services:
  postgres:
    image: postgres:16-alpine
    container_name: streamflix-postgres

    environment:
      # Estas tres variables son las que la imagen oficial de Postgres usa
      # para crear el usuario, la contraseña y la base de datos en el primer arranque.
      POSTGRES_USER: streamflix_user
      POSTGRES_PASSWORD: streamflix_password
      POSTGRES_DB: streamflix

    ports:
      # host:contenedor. La API (fuera de Docker) se conecta a localhost:5432,
      # que Docker redirige al puerto 5432 dentro del contenedor donde escucha Postgres.
      - "5432:5432"

    volumes:
      # Sin este volumen, los datos vivirían solo dentro del contenedor y
      # se perderían cada vez que se hiciera `docker compose down`.
      # Con el volumen nombrado, los datos persisten en disco entre reinicios.
      - streamflix_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamflix_user -d streamflix"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamflix-api

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # "postgres" es el nombre del servicio de arriba, no "localhost":
      # dentro de la red que crea Compose, cada contenedor se resuelve por
      # el nombre de su servicio. "localhost" acá adentro sería el propio
      # contenedor de la API, no el de Postgres.
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=streamflix;Username=streamflix_user;Password=streamflix_password"

    ports:
      # host:contenedor. Queda en el mismo puerto que al correrla con
      # `dotnet run` (ver README), para no tener que recordar dos URLs.
      - "5188:8080"

    depends_on:
      # No alcanza con que el contenedor de Postgres exista: hay que
      # esperar a que ya acepte conexiones (su healthcheck), o la API
      # fallaría al aplicar las migraciones en el primer arranque.
      postgres:
        condition: service_healthy

volumes:
  streamflix_postgres_data:
